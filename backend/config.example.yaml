# StreamPass backend configuration.
# Copy this file to config.yaml and adjust as needed; ${VAR} placeholders
# are resolved against the process environment at load time — no secret
# ever belongs directly in this file (see .env.example for the variables
# to set).

server:
  http_port: 8080
  log_level: info # debug | info | warn | error

database:
  host: ${DB_HOST}
  port: 5432
  name: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  sslmode: disable
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 30m

redis:
  addr: ${REDIS_ADDR}
  password: ${REDIS_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  access_ttl: 15m
  refresh_ttl: 720h

admin:
  api_key: ${ADMIN_API_KEY}

rate_limit:
  public_requests_per_window: 20
  public_window: 1m

billing:
  plan_amount_rub: 299
  plan_period_days: 30
  yearly_amount_rub: 2990
  yearly_period_days: 365
  plan_basic_rub: 299
  plan_pro_rub: 499
  plan_business_rub: 1490
  # yookassa | platega — card/SBP provider for POST /payments (Telegram Stars still overrides when bot token set)
  default_provider: yookassa
  webhook_secret: ${PAYMENTS_WEBHOOK_SECRET}
  yookassa_shop_id: ${YOOKASSA_SHOP_ID}
  yookassa_secret_key: ${YOOKASSA_SECRET_KEY}
  yookassa_return_url: ${YOOKASSA_RETURN_URL}
  platega_merchant_id: ${PLATEGA_MERCHANT_ID}
  platega_secret: ${PLATEGA_SECRET}
  platega_return_url: ${PLATEGA_RETURN_URL}
  platega_failed_url: ${PLATEGA_FAILED_URL}
  platega_payment_method: 2 # 2=SBP QR, 10=cards
  # Telegram Stars + USDT (TZ 02.3 / BL-040). When telegram_bot_token is set,
  # POST /payments creates Stars invoices instead of YooKassa/Platega.
  telegram_bot_token: ${TELEGRAM_BOT_TOKEN}
  telegram_webhook_secret: ${TELEGRAM_WEBHOOK_SECRET}
  usdt_trc20_address: ${USDT_TRC20_ADDRESS}
  # Optional Stars amounts override (defaults: 499 / 1299 / 3999)
  # stars_month: 499
  # stars_quarter: 1299
  # stars_year: 3999
  public_url: ${STREAMPASS_PUBLIC_URL}

# When true, POST /password/forgot returns reset_token in JSON (no SMTP yet).
# Keep false in production once email delivery is wired.
auth:
  expose_reset_token: true
  max_devices: 3
