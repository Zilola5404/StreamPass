<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StreamPass — Оплата</title>
  <style>
    :root {
      --bg: #020612;
      --surface: #07111f;
      --cyan: #00e5ff;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ff5a6e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #0d1a2b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    main { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p { color: var(--muted); line-height: 1.5; }
    .card {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 20px;
      margin-top: 20px;
    }
    .card h2 { margin: 0 0 12px; font-size: 1.1rem; }
    button, .btn {
      display: inline-block;
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      color: var(--bg);
      background: var(--cyan);
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .addr {
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #020612;
      padding: 12px;
      border-radius: 12px;
      margin: 12px 0;
    }
    .warn { color: var(--danger); font-size: .9rem; }
    #qr { display: block; margin: 12px auto; background: #fff; padding: 8px; border-radius: 12px; }
    label { display: block; margin-top: 12px; color: var(--muted); font-size: .85rem; }
    input, select {
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: #020612;
      color: var(--text);
    }
    .hint { font-size: .85rem; color: var(--muted); margin-top: 8px; }
    .ok { color: #00ff9c; }
    .err { color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <h1>StreamPass</h1>
    <p>Откройте приложение StreamPass, перейдите в раздел «Подписка» и выберите доступный тариф.</p>
    <p>Если вы уже оплатили подписку, вернитесь в приложение и обновите статус.</p>
  </main>
</body>
</html>
