name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go test
        run: go test ./...
      - name: go build server
        run: go build -o /tmp/streampass-server ./backend/cmd/server

  client-go-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/go_core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go test go_core
        run: go test ./...

  client-flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write CI .env
        run: |
          printf '%s\n' \
            'DB_PASSWORD=ci_test_db_password' \
            'REDIS_PASSWORD=ci_test_redis_password' \
            'JWT_SECRET=ci_test_jwt_secret_at_least_32_chars' \
            'ADMIN_API_KEY=ci_admin_api_key' \
            > .env
      - name: docker compose build
        run: docker compose build
